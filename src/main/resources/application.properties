spring.application.name=SmartCart
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.root=${LOG_LEVEL:INFO}


spring.h2.console.enabled=true

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:SmartCart}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${JPA_SHOW_URL:true}

management.endpoint.health.show-details=ALWAYS
management.endpoints.web.base-path=/SmartCart/actuator
management.endpoints.web.exposure.include=*

management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description =Backend for Ecommerce application
info.app.email=sumanth.gmail.com
info.app.version=1.0.0

